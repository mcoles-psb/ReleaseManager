<!-- Revert Page - Revert a production commit -->
<div class="section">
    <div class="section-header">
        <span class="section-title">Revert Production Commit</span>
    </div>
    <p class="text-muted mb-16">
        Use <strong>git revert</strong> to safely undo a production commit.
        This creates a new commit that reverses the changes without rewriting history.
    </p>

    <div class="form-inline">
        <div class="form-group">
            <label class="form-label">Repository</label>
            <select class="form-select" id="revert-repo-select">
                <option value="">-- Select Repository --</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Branch</label>
            <select class="form-select" id="revert-branch-select">
                <option value="">-- Select Branch --</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Commit Hash</label>
            <input type="text" class="form-input" id="revert-commit-input"
                placeholder="e.g. a1b2c3d">
        </div>
        <div class="form-group">
            <label class="form-label">&nbsp;</label>
            <button class="btn btn-danger" id="revert-btn" disabled>Revert Commit</button>
        </div>
    </div>
</div>

<div class="section">
    <div class="section-header">
        <span class="section-title">Recent Production History</span>
        <button class="btn btn-sm btn-secondary" onclick="refreshRecentHistory()">Refresh</button>
    </div>
    <div class="table-wrapper">
        <table class="data-table table-sm" id="recent-history-table">
            <thead>
                <tr>
                    <th>Commit</th>
                    <th>Author</th>
                    <th>Date</th>
                    <th>Message</th>
                </tr>
            </thead>
            <tbody id="recent-history-body">
                <tr>
                    <td colspan="4" class="text-muted" style="text-align:center;padding:24px;">
                        Select a repository and branch to view recent history.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
